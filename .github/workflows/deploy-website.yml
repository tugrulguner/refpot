name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://refpot.modepot.io/
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Match the documentation revision used by website CI.
      - name: Configure Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Require configured deployment identity
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Website checks and deployment build
        run: |
          docker run --rm --init --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/work" -v "$(command -v uv):/usr/local/bin/uv:ro" -w /work/website \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            bash -lc 'git config --global --add safe.directory /work && uv venv --managed-python --python 3.11 /tmp/pyenv && uv pip install --python /tmp/pyenv/bin/python pip && . /tmp/pyenv/bin/activate && python --version && node --version && npm ci && npx playwright install chromium && npm run check && npm run build'
      - run: npx wrangler deploy
