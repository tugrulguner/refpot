name: Website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: website build and browser acceptance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # Resolve the canonical documentation source revision.
      - name: Configure Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Prepare container-compatible Python
        working-directory: .
        run: |
          uv venv --managed-python --python 3.11 "$RUNNER_TEMP/refpot-presentation"
          uv pip install --python "$RUNNER_TEMP/refpot-presentation/bin/python" pip
          echo "$RUNNER_TEMP/refpot-presentation/bin" >> "$GITHUB_PATH"
      - name: Verify container runtime versions and TLS
        run: |
          python --version
          python -c 'import ssl; print(ssl.OPENSSL_VERSION)'
          node -e 'if (process.versions.node.split(".")[0] !== "22") throw Error("Expected Node 22"); console.log(process.version)'
      - name: Repository presentation contracts
        working-directory: .
        run: |
          uv sync --locked --managed-python --python 3.11
          uv run --locked python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run check
      - run: npm run build
