name: Website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: website build and browser acceptance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # Resolve the canonical documentation source revision.
      - name: Configure Git workspace trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Repository presentation contracts
        working-directory: .
        run: |
          uv sync --locked --python 3.11
          uv run --locked python -m unittest discover -s tests -v
      - name: Browser engine and official container match
        run: |
          docker run --rm --init --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/work" -v "$(command -v uv):/usr/local/bin/uv:ro" -w /work/website \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            bash -lc 'git config --global --add safe.directory /work && uv venv --managed-python --python 3.11 /tmp/pyenv && uv pip install --python /tmp/pyenv/bin/python pip && . /tmp/pyenv/bin/activate && python --version && node --version && npm ci && npx playwright install chromium && npm run check && npm run build'
