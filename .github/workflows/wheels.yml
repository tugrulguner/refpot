name: Native wheels

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Build canonical source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
          enable-cache: false
      - run: uv build --sdist
      - run: uv run --locked python scripts/verify_artifacts.py dist/
      - run: (cd dist && shasum -a 256 -- ./*.tar.gz > SOURCE-SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/SOURCE-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  wheel:
    needs: source
    name: ${{ matrix.platform }} cp${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: manylinux_x86_64
            python: '3.11'
            tag: cp311
          - runner: ubuntu-latest
            platform: manylinux_x86_64
            python: '3.12'
            tag: cp312
          - runner: ubuntu-latest
            platform: manylinux_x86_64
            python: '3.13'
            tag: cp313
          - runner: ubuntu-latest
            platform: manylinux_x86_64
            python: '3.14'
            tag: cp314
          - runner: macos-latest
            platform: macos_arm64
            python: '3.11'
            tag: cp311
          - runner: macos-latest
            platform: macos_arm64
            python: '3.12'
            tag: cp312
          - runner: macos-latest
            platform: macos_arm64
            python: '3.13'
            tag: cp313
          - runner: macos-latest
            platform: macos_arm64
            python: '3.14'
            tag: cp314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: source
      - name: Verify and extract canonical sdist
        run: |
          set -euo pipefail
          (cd source && shasum -a 256 -c SOURCE-SHA256SUMS)
          python -m tarfile -e source/*.tar.gz extracted
          src=$(find extracted -mindepth 1 -maxdepth 1 -type d)
          echo "SOURCE_ROOT=$src" >> "$GITHUB_ENV"
      - name: Build CPython wheel
        uses: pypa/cibuildwheel@63fd63b352a9a8bdcc24791c9dbee952ee9a8abc # v3.3.0
        env:
          CIBW_BUILD: ${{ matrix.tag }}-*
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
        with:
          package-dir: ${{ env.SOURCE_ROOT }}
          output-dir: wheelhouse
      - name: Verify extracted sdist and built wheel
        run: |
          set -euo pipefail
          cp source/*.tar.gz wheelhouse/
          python "$SOURCE_ROOT/scripts/verify_artifacts.py" wheelhouse/
      - name: Test actual wheel install and consumer tests
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" wheelhouse/*.whl pytest
          install="$RUNNER_TEMP/wheel-test/bin/python"
          "$install" -c 'import pathlib, refpot; assert ".venv" not in str(pathlib.Path(refpot.__file__).resolve()); print(refpot.__file__)'
          mkdir -p "$RUNNER_TEMP/refpot-consumer/tests"
          cp -R "$SOURCE_ROOT/examples" "$RUNNER_TEMP/refpot-consumer/"
          cp "$SOURCE_ROOT"/tests/test_database.py "$SOURCE_ROOT"/tests/test_package_recovery.py "$SOURCE_ROOT"/tests/test_state_machine.py "$SOURCE_ROOT"/tests/test_io_failures.py "$SOURCE_ROOT"/tests/test_capacity.py "$RUNNER_TEMP/refpot-consumer/tests/"
          cp -R "$SOURCE_ROOT"/tests/native "$RUNNER_TEMP/refpot-consumer/tests/"
          cd "$RUNNER_TEMP/refpot-consumer"
          "$install" -m pytest tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
