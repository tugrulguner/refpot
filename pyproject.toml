[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "refpot"
version = "0.1.1"
description = "Embedded native key-value database engine"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8"]

[tool.scikit-build]
wheel.packages = ["src/refpot"]
sdist.exclude = ["website/**", "benchmarks/**", ".venv/**", "dist/**", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
