<text x="70" y="125" fill="#F4F2EA" font-size="46" font-weight="700">Random updates. Repeated success.</text>
<text x="70" y="165" fill="#C4CAD3" font-size="23">131,072 requests per trial · 100k / 1M existing rows · 1 / 4 / 16 / 64 clients</text>
