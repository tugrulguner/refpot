<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">RefPot audited random-update benchmark</title>
<desc id="desc">672 records and 16 repeated cells. Service speedup 3.04 to 5.95 times and setup-inclusive 2.99 to 5.91 times against best-tested equally batched SQLite with atomic receipt tracking. Both campaigns shown for 100k and 1M rows and 1, 4, 16, 64 clients. Every tested cell passes service, setup and p99. Reopen with full-state validation loses all 16 cells. Fixed-schema research in a Linux ARM64 Docker ext4 VM, not a general database claim.</desc>
