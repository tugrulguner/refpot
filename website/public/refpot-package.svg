<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">RefPot package preview architecture</title><desc id="desc">Unreleased local source-build preview: Python Database and Row connect to native C++ storage. Changed-row transactions write two identical checksummed redo copies and synchronize before publishing memory. Checkpointing synchronizes a full snapshot, renames it, synchronizes the parent directory, then truncates and synchronizes the WAL. Recovery is bounded; package qualification is ongoing.</desc><rect width="1200" height="760" rx="26" fill="#17191c"/><text x="56" y="62" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="28" font-weight="700">REFPOT · UNRELEASED SOURCE-BUILD PREVIEW</text><text x="56" y="100" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="18">Custom C++ engine · Python CRUD + explicit transactions · not a PyPI release</text><g font-family="Arial,sans-serif" fill="#F4F2EA"><rect x="56" y="155" width="250" height="112" rx="15" fill="#25282d" stroke="#69717d" stroke-width="2"/><text x="181" y="199" text-anchor="middle" font-size="22" font-weight="700">Python interface</text><text x="181" y="234" text-anchor="middle" font-size="18">Database · Row</text><rect x="462" y="155" width="280" height="112" rx="15" fill="#25282d" stroke="#69717d" stroke-width="2"/><text x="602" y="199" text-anchor="middle" font-size="22" font-weight="700">Native C++ engine</text><text x="602" y="234" text-anchor="middle" font-size="18">CRUD · transaction state</text><rect x="900" y="155" width="244" height="112" rx="15" fill="#25282d" stroke="#69717d" stroke-width="2"/><text x="1022" y="199" text-anchor="middle" font-size="22" font-weight="700">On-disk files</text><text x="1022" y="234" text-anchor="middle" font-size="18">snapshot + .wal</text></g><g stroke="#F4F2EA" stroke-width="3" fill="none"><path d="M306 211h156m-12-12 12 12-12 12"/><path d="M742 211h158m-12-12 12 12-12 12"/></g><rect x="56" y="310" width="1088" height="164" rx="16" fill="#22252a" stroke="#49515e" stroke-width="2"/><text x="84" y="350" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="22" font-weight="700">Changed-row transaction</text><text x="84" y="391" fill="#d5d6d8" font-family="Arial,sans-serif" font-size="19">two identical checksummed redo copies → synchronize WAL → publish in-memory state</text><text x="84" y="437" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="17">Not independent physical replicas · uncertain write poisons writer</text><rect x="56" y="502" width="1088" height="150" rx="16" fill="#22252a" stroke="#49515e" stroke-width="2"/><text x="84" y="542" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="22" font-weight="700">Checkpoint and recovery</text><text x="84" y="580" fill="#d5d6d8" font-family="Arial,sans-serif" font-size="18">snapshot sync → atomic rename → parent-directory sync → WAL truncate + sync</text><text x="84" y="618" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="17">64 MiB bound per snapshot/WAL · incomplete unacknowledged tail discarded · qualification in progress</text><text x="56" y="704" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="16">Single-process exclusive ownership · thread-affine API · no SQL/ORM · no Windows or power-loss qualification</text></svg>