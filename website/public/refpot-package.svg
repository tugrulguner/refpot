<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">RefPot experimental alpha package architecture</title>
<desc id="desc">Python Database and Row call a native C++ engine and snapshot plus WAL files. Transactions stage row-local change sets, prepare serialized effects, synchronize two checksummed redo copies, then publish prepared changes without allocation. Recovery validates and prepares a frame before applying row-local effects. Checkpoint publication syncs a snapshot, atomically renames it, syncs the parent directory, then truncates and syncs the WAL. API and storage framing are unchanged. Qualification remains limited.</desc>
<rect width="1200" height="820" rx="28" fill="#17191c"/>
<text x="56" y="58" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="27" font-weight="700">REFPOT · EXPERIMENTAL ALPHA</text>
<text x="56" y="96" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="18">Native Python package · API and storage framing unchanged</text>
<g font-family="Arial,sans-serif" fill="#F4F2EA">
<rect x="56" y="134" width="250" height="108" rx="15" fill="#25282d" stroke="#69717d" stroke-width="2"/>
<text x="181" y="177" text-anchor="middle" font-size="22" font-weight="700">Python interface</text><text x="181" y="213" text-anchor="middle" font-size="18">Database · Row</text>
<rect x="472" y="134" width="280" height="108" rx="15" fill="#25282d" stroke="#69717d" stroke-width="2"/>
<text x="612" y="177" text-anchor="middle" font-size="22" font-weight="700">Native C++ engine</text><text x="612" y="213" text-anchor="middle" font-size="18">CRUD · transaction state</text>
<rect x="900" y="134" width="244" height="108" rx="15" fill="#25282d" stroke="#69717d" stroke-width="2"/>
<text x="1022" y="177" text-anchor="middle" font-size="22" font-weight="700">On-disk files</text><text x="1022" y="213" text-anchor="middle" font-size="18">snapshot + .wal</text>
</g>
<g stroke="#F4F2EA" stroke-width="3" fill="none"><path d="M306 188h166m-12-12 12 12-12 12"/><path d="M752 188h148m-12-12 12 12-12 12"/></g>
<rect x="56" y="276" width="1088" height="235" rx="18" fill="#22252a" stroke="#49515e" stroke-width="2"/>
<text x="84" y="316" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="22" font-weight="700">Transaction change-set path</text>
<g font-family="Arial,sans-serif" fill="#F4F2EA" font-size="17">
<rect x="84" y="345" width="235" height="82" rx="12" fill="#2b2e33" stroke="#69717d"/><text x="201" y="378" text-anchor="middle" font-weight="700">Stage row-local</text><text x="201" y="405" text-anchor="middle">effects · no map clone</text>
<rect x="358" y="345" width="235" height="82" rx="12" fill="#2b2e33" stroke="#69717d"/><text x="475" y="378" text-anchor="middle" font-weight="700">Prepare final</text><text x="475" y="405" text-anchor="middle">encoded change set</text>
<rect x="632" y="345" width="235" height="82" rx="12" fill="#2b2e33" stroke="#69717d"/><text x="749" y="378" text-anchor="middle" font-weight="700">Write duplicate</text><text x="749" y="405" text-anchor="middle">checksummed redo</text>
<rect x="906" y="345" width="210" height="82" rx="12" fill="#2b2e33" stroke="#69717d"/><text x="1011" y="378" text-anchor="middle" font-weight="700">Sync WAL →</text><text x="1011" y="405" text-anchor="middle">publish without alloc</text>
</g>
<g stroke="#F4F2EA" stroke-width="2.5" fill="none"><path d="M319 386h39m-10-10 10 10-10 10"/><path d="M593 386h39m-10-10 10 10-10 10"/><path d="M867 386h39m-10-10 10 10-10 10"/></g>
<text x="84" y="473" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="17">Preparation precedes durable I/O; publication applies prepared row effects only after redo synchronization.</text>
<rect x="56" y="535" width="528" height="196" rx="18" fill="#22252a" stroke="#49515e" stroke-width="2"/>
<text x="84" y="575" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="22" font-weight="700">Recovery · row-local replay</text>
<text x="84" y="617" fill="#d5d6d8" font-family="Arial,sans-serif" font-size="18">Read + validate frame → prepare effects</text>
<text x="84" y="651" fill="#d5d6d8" font-family="Arial,sans-serif" font-size="18">Apply only affected rows; no unrelated-map copy</text>
<text x="84" y="699" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="16">64 MiB recovery bounds · incomplete tail discarded</text>
<rect x="616" y="535" width="528" height="196" rx="18" fill="#22252a" stroke="#49515e" stroke-width="2"/>
<text x="644" y="575" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="22" font-weight="700">Checkpoint publication</text>
<text x="644" y="617" fill="#d5d6d8" font-family="Arial,sans-serif" font-size="18">Snapshot sync → atomic rename</text>
<text x="644" y="651" fill="#d5d6d8" font-family="Arial,sans-serif" font-size="18">Parent-directory sync → WAL truncate + sync</text>
<text x="644" y="699" fill="#bdc0c4" font-family="Arial,sans-serif" font-size="16">Implementation behavior; not power-loss qualification</text>
<text x="56" y="782" fill="#F4F2EA" font-family="Arial,sans-serif" font-size="16">Single-process exclusive ownership · thread-affine API · no SQL/ORM · Windows unsupported · qualification limited</text>
</svg>